# CraveCircle Whisper transcriber. The 4GB GTX 1650 runs Whisper small at float16.
# Ollama's 7B stays on CPU — it does not fit beside Whisper on this card.
services:
  whisper-transcriber:
    build: .
    container_name: cravecircle-whisper
    restart: unless-stopped
    gpus: all
    environment:
      WHISPER_MODEL: small
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_BEAM_SIZE: "1"
      COOKIES_FILE: /cookies/cookies.txt
      DB_PATH: /models/cravecircle_admin.db
      LLM_TRANSLATOR_URL: http://ollama:11434/v1
      LLM_TRANSLATOR_MODEL: qwen2.5:7b
    depends_on:
      - ollama
    volumes:
      - whisper-models:/models
      - ./cookies:/cookies:ro
    ports:
      - "8009:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen(\"http://localhost:8000/health\")"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  ollama:
    image: ollama/ollama:latest
    container_name: cravecircle-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  whisper-models:
  ollama-data:
