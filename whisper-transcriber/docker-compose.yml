# CraveCircle Whisper transcriber. GPU on this host is shared/full (Voiceprint holds ~3.3GB of the
# 4GB GTX 1650), so we run the medium model on CPU (int8) for a quality bump over small. If the GPU
# is freed later, set WHISPER_DEVICE=cuda + WHISPER_COMPUTE_TYPE=float16 and add a gpu reservation.
services:
  whisper-transcriber:
    build: .
    container_name: cravecircle-whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: medium
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_BEAM_SIZE: "5"
      COOKIES_FILE: /cookies/cookies.txt
    volumes:
      - whisper-models:/models
      - ./cookies:/cookies:ro
    ports:
      - "8009:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen(\"http://localhost:8000/health\")"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  whisper-models:
